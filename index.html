<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesserium Labs</title>
  <meta name="description" content="Tesserium Labs — coming soon.">
  <style>
    :root { --bg: #0b0d12; --fg: #e8eaf0; --muted: #8a90a2; --accent: #7c9cff; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f8fb; --fg: #12141a; --muted: #5b6172; --accent: #3a5bd9; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; max-width: 36rem; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1.5rem; color: var(--accent); }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; letter-spacing: -0.02em; }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.1rem; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <rect x="6" y="6" width="44" height="44" rx="6"/>
      <rect x="17" y="17" width="22" height="22" rx="3"/>
      <path d="M6 6l11 11M50 6L39 17M6 50l11-11M50 50L39 39"/>
    </svg>
    <h1>Tesserium Labs</h1>
    <p>Something new is on the way. Check back soon.</p>
    <footer>&copy; <span id="y">2026</span> Tesserium Labs</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
